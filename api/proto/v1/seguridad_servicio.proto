syntax = "proto3";

package dbgs.v1;

option go_package = "DBGS_SOBERANO_BACKEND/api/proto/v1;dbgsv1";

// Se importa el paquete de anotaciones para mapear los métodos a rutas HTTP/REST
import "google/api/annotations.proto";

// Servicio gRPC para autenticación, RBAC y validación de tokens
service SeguridadService {
  // Expone el endpoint como POST. 'body: "*"' indica que todo el JSON va en el cuerpo de la petición.
  rpc Login (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/login"
      body: "*"
    };
  }

  rpc ValidarToken (ValidarTokenRequest) returns (ValidarTokenResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/validar-token"
      body: "*"
    };
  }

  rpc VerificarPermiso (VerificarPermisoRequest) returns (VerificarPermisoResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/verificar-permiso"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
}

message ValidarTokenRequest {
  string token = 1;
}

message ValidarTokenResponse {
  bool es_valido = 1;
  string usuario_id = 2;
  string username = 3;
  string rol = 4;
}

message VerificarPermisoRequest {
  string usuario_id = 1;
  string recurso = 2;
  string accion = 3;
}

message VerificarPermisoResponse {
  bool permitido = 1;
  string razon = 2;
}