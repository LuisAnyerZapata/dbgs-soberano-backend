syntax = "proto3";

package dbgs.v1;

option go_package = "DBGS_SOBERANO_BACKEND/api/proto/v1;dbgsv1";

// Se importa el paquete de anotaciones para mapear los métodos a rutas HTTP/REST
import "google/api/annotations.proto";

// Servicio gRPC para autenticación, RBAC, validación de tokens y configuración inicial
service SeguridadService {
  // --- Métodos de Setup Inicial (Públicos y condicionales) ---

  // Verifica si el sistema ya ha sido inicializado (existe al menos un SUPER_ADMIN)
  rpc GetSetupStatus (GetSetupStatusRequest) returns (GetSetupStatusResponse) {
    option (google.api.http) = {
      get: "/v1/auth/setup-status"
    };
  }

  // Crea el primer usuario SUPER_ADMIN. Solo se permite si el sistema no está inicializado.
  rpc CreateSetup (CreateSetupRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/setup"
      body: "*"
    };
  }

  // Expone el endpoint como POST. 'body: "*"' indica que todo el JSON va en el cuerpo de la petición.
  rpc Login (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/login"
      body: "*"
    };
  }

  rpc ValidarToken (ValidarTokenRequest) returns (ValidarTokenResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/validar-token"
      body: "*"
    };
  }

  rpc VerificarPermiso (VerificarPermisoRequest) returns (VerificarPermisoResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/verificar-permiso"
      body: "*"
    };
  }

  // --- CRUD de Roles ---

  rpc CrearRol (CrearRolRequest) returns (CrearRolResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/roles"
      body: "*"
    };
  }

  rpc ListarRoles (ListarRolesRequest) returns (ListarRolesResponse) {
    option (google.api.http) = {
      get: "/v1/seguridad/roles"
    };
  }

  rpc ObtenerRol (ObtenerRolRequest) returns (ObtenerRolResponse) {
    option (google.api.http) = {
      get: "/v1/seguridad/roles/{id}"
    };
  }

  rpc ActualizarRol (ActualizarRolRequest) returns (ActualizarRolResponse) {
    option (google.api.http) = {
      put: "/v1/seguridad/roles/{id}"
      body: "*"
    };
  }

  rpc EliminarRol (EliminarRolRequest) returns (EliminarRolResponse) {
    option (google.api.http) = {
      delete: "/v1/seguridad/roles/{id}"
    };
  }

  // --- Permisos de Roles ---

  rpc VincularPermisoRol (VincularPermisoRolRequest) returns (VincularPermisoRolResponse) {
    option (google.api.http) = {
      post: "/v1/seguridad/roles/{rol_id}/permisos"
      body: "*"
    };
  }

  rpc DesvincularPermisoRol (DesvincularPermisoRolRequest) returns (DesvincularPermisoRolResponse) {
    option (google.api.http) = {
      delete: "/v1/seguridad/roles/{rol_id}/permisos/{permiso_id}"
    };
  }

  rpc ListarPermisosRol (ListarPermisosRolRequest) returns (ListarPermisosRolResponse) {
    option (google.api.http) = {
      get: "/v1/seguridad/roles/{rol_id}/permisos"
    };
  }
}

message GetSetupStatusRequest {}

message GetSetupStatusResponse {
  // Indica si ya existe al menos un administrador principal en el sistema
  bool initialized = 1;
}

message CreateSetupRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
}

message ValidarTokenRequest {
  string token = 1;
}

message ValidarTokenResponse {
  bool es_valido = 1;
  string usuario_id = 2;
  string username = 3;
  string rol = 4;
}

message VerificarPermisoRequest {
  string usuario_id = 1;
  string recurso = 2;
  string accion = 3;
}

message VerificarPermisoResponse {
  bool permitido = 1;
  string razon = 2;
}

// --- Mensajes de Roles ---

message CrearRolRequest {
  string nombre = 1;
  string descripcion = 2;
}

message CrearRolResponse {
  string id = 1;
  string nombre = 2;
  string descripcion = 3;
  string mensaje = 4;
}

message ListarRolesRequest {}

message RolProto {
  string id = 1;
  string nombre = 2;
  string descripcion = 3;
}

message ListarRolesResponse {
  repeated RolProto roles = 1;
}

message ObtenerRolRequest {
  string id = 1;
}

message ObtenerRolResponse {
  string id = 1;
  string nombre = 2;
  string descripcion = 3;
}

message ActualizarRolRequest {
  string id = 1;
  string nombre = 2;
  string descripcion = 3;
}

message ActualizarRolResponse {
  string id = 1;
  string nombre = 2;
  string descripcion = 3;
  string mensaje = 4;
}

message EliminarRolRequest {
  string id = 1;
}

message EliminarRolResponse {
  string mensaje = 1;
}

// --- Mensajes de Permisos de Roles ---

message VincularPermisoRolRequest {
  string rol_id = 1;
  repeated string permisos = 2; // Códigos de permisos a vincular
}

message VincularPermisoRolResponse {
  int32 vinculados = 1;
  string mensaje = 2;
}

message DesvincularPermisoRolRequest {
  string rol_id = 1;
  string permiso_id = 2;
}

message DesvincularPermisoRolResponse {
  string mensaje = 1;
}

message ListarPermisosRolRequest {
  string rol_id = 1;
}

message ListarPermisosRolResponse {
  repeated string permisos = 1;
}