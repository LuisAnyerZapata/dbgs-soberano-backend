syntax = "proto3";

package dbgs.v1;

option go_package = "DBGS_SOBERANO_BACKEND/api/proto/v1;dbgsv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Servicio para la gestión dinámica de estructuras de datos (Motor tipo PocketBase)
service ColeccionesService {
  // Crea una nueva tabla en la base de datos basándose en la definición de campos JSON
  rpc CrearColeccion (CrearColeccionRequest) returns (CrearColeccionResponse) {
    option (google.api.http) = {
      post: "/v1/colecciones"
      body: "*"
    };
  }

  // Lista las colecciones dinámicas registradas en el diccionario de datos
  rpc ListarColecciones (ListarColeccionesRequest) returns (ListarColeccionesResponse) {
    option (google.api.http) = {
      get: "/v1/colecciones"
    };
  }

  // Agrega nuevas columnas a una tabla dinámica existente (solo aditivo)
  rpc ActualizarColeccion (ActualizarColeccionRequest) returns (ActualizarColeccionResponse) {
    option (google.api.http) = {
      post: "/v1/colecciones/{nombre}/actualizar"
      body: "*"
    };
  }

  // Elimina o desactiva una colección dinámica
  rpc EliminarColeccion (EliminarColeccionRequest) returns (EliminarColeccionResponse) {
    option (google.api.http) = {
      delete: "/v1/colecciones/{nombre}"
    };
  }
}

// --- Mensajes para Crear ---

message CampoDinamicoProto {
  string nombre = 1;
  string tipo = 2; // STRING, TEXT, INTEGER, FLOAT, BOOLEAN, UUID, JSONB, TIMESTAMPTZ
  bool nulo = 3;
  bool unico = 4;
  string descripcion = 5;
}

message CrearColeccionRequest {
  string nombre = 1;
  string descripcion = 2;
  repeated CampoDinamicoProto campos = 3;
  string institucion_id = 4; // Opcional para futuro RLS
}

message CrearColeccionResponse {
  string id = 1;
  string nombre_logico = 2;
  string nombre_fisico = 3; // El prefijo "dyn_" aplicado
  string mensaje = 4;
}

// --- Mensajes para Listar ---

message ListarColeccionesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ColeccionRegistroProto {
  string id = 1;
  string nombre_logico = 2;
  string nombre_fisico = 3;
  string descripcion = 4;
  string estructura_json = 5; // Devuelve el JSON de los campos para que la UI sepa cómo renderizar formularios
  bool esta_activa = 6;
  string created_at = 7;
}

message ListarColeccionesResponse {
  repeated ColeccionRegistroProto colecciones = 1;
  int32 total = 2;
}

// --- Mensajes para Actualizar (edición completa) ---

message RenombrarColumnaProto {
  string nombre_actual = 1;
  string nombre_nuevo = 2;
}

message CambiarTipoColumnaProto {
  string nombre = 1;
  string nuevo_tipo = 2; // STRING, TEXT, INTEGER, FLOAT, BOOLEAN, UUID, JSONB, TIMESTAMPTZ
}

message ActualizarColeccionRequest {
  string nombre = 1;                                // Nombre actual (del URL)
  string nuevo_nombre = 2;                          // Renombrar tabla (requiere confirmar)
  string descripcion = 3;                           // Actualizar descripción (vacío = sin cambio)
  repeated CampoDinamicoProto campos_agregar = 4;   // Columnas nuevas a agregar
  repeated RenombrarColumnaProto campos_renombrar = 5; // Columnas a renombrar
  repeated CambiarTipoColumnaProto campos_tipo = 6; // Columnas a cambiar tipo
  repeated string campos_eliminar = 7;              // Nombres de columnas a eliminar
  bool confirmar = 8;                              // Requerido para drops y rename de tabla
}

message ActualizarColeccionResponse {
  string id = 1;
  string nombre_logico = 2;
  int32 campos_agregados = 3;
  int32 campos_renombrados = 4;
  int32 campos_tipo_cambiado = 5;
  int32 campos_eliminar = 6;
  string nombre_tabla_anterior = 7;  // Solo se llena si se renombró la tabla
  string mensaje = 8;
}

// --- Mensajes para Eliminar ---

message EliminarColeccionRequest {
  string nombre = 1;    // Nombre lógico de la colección a eliminar
  bool confirmar = 2;   // true = DROP TABLE + DELETE metadata; false = soft delete (esta_activa=false)
}

message EliminarColeccionResponse {
  string nombre_logico = 1;
  string accion_realizada = 2;  // "desactivada" o "eliminada"
  string mensaje = 3;
}