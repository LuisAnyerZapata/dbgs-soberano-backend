syntax = "proto3";

package dbgs.v1;

option go_package = "DBGS_SOBERANO_BACKEND/api/proto/v1;dbgsv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Servicio gRPC de SOLO LECTURA para la consulta de eventos de auditoría.
// La escritura ocurre exclusivamente a nivel de motor (triggers fn_auditar_cambios),
// nunca por petición del cliente, para evitar la falsificación de trazas.
service AuditoriaService {
  // Nota: grpc-gateway parsea automáticamente los Timestamps en Query Strings si se envían en formato RFC3339
  rpc ConsultarEventos (ConsultarEventosRequest) returns (ConsultarEventosResponse) {
    option (google.api.http) = {
      get: "/v1/auditoria/eventos"
    };
  }
}

message EventoAuditoria {
  string id = 1;
  string usuario_id = 2;
  string username = 3;
  string operacion = 4;
  string recurso = 5;
  string detalles = 6;
  string resultado = 7;
  string ip_origen = 8;
  google.protobuf.Timestamp fecha_creacion = 9;
}

message ConsultarEventosRequest {
  string usuario_id = 1;
  string operacion = 2;
  google.protobuf.Timestamp fecha_inicio = 3;
  google.protobuf.Timestamp fecha_fin = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ConsultarEventosResponse {
  repeated EventoAuditoria eventos = 1;
  int32 total = 2;
}